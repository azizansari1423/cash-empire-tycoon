name: Handoff Notifications

on:
  push:
    paths:
      - '_project_handoff/**'
    # all branches
  workflow_dispatch:
    inputs:
      action:
        description: 'Control handoff notifications'
        required: true
        type: choice
        options:
          - start
          - stop
          - status

permissions:
  contents: write  # manage-control: create/delete the flag file via Contents API
  issues: write    # notify-handoff: create notification issues

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Manual control — start / stop / status
  # Runs only on workflow_dispatch; never on push.
  # ─────────────────────────────────────────────────────────────────────────────
  manage-control:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      FLAG: .github/handoff-enabled
    steps:
      - name: Start notifications
        if: inputs.action == 'start'
        run: |
          set +e
          EXISTING=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/contents/${FLAG}" 2>&1)
          EXISTS_EXIT=$?
          set -e

          CONTENT=$(printf 'enabled' | base64)

          if [ $EXISTS_EXIT -eq 0 ]; then
            SHA=$(echo "$EXISTING" | jq -r '.sha')
            gh api --method PUT \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPO}/contents/${FLAG}" \
              -f message="chore: enable handoff notifications [skip ci]" \
              -f content="$CONTENT" \
              -f sha="$SHA"
            echo "Handoff notifications ENABLED (flag file updated)."
          elif echo "$EXISTING" | grep -qi '"status":"404"\|Not Found'; then
            gh api --method PUT \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPO}/contents/${FLAG}" \
              -f message="chore: enable handoff notifications [skip ci]" \
              -f content="$CONTENT"
            echo "Handoff notifications ENABLED (flag file created)."
          else
            echo "ERROR: Unexpected API failure checking flag file." >&2
            echo "$EXISTING" >&2
            exit 1
          fi

      - name: Stop notifications
        if: inputs.action == 'stop'
        run: |
          set +e
          EXISTING=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/contents/${FLAG}" 2>&1)
          EXISTS_EXIT=$?
          set -e

          if [ $EXISTS_EXIT -eq 0 ]; then
            SHA=$(echo "$EXISTING" | jq -r '.sha')
            gh api --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPO}/contents/${FLAG}" \
              -f message="chore: disable handoff notifications [skip ci]" \
              -f sha="$SHA"
            echo "Handoff notifications DISABLED (flag file deleted)."
          elif echo "$EXISTING" | grep -qi '"status":"404"\|Not Found'; then
            echo "Flag file not present; notifications were already disabled."
          else
            echo "ERROR: Unexpected API failure checking flag file." >&2
            echo "$EXISTING" >&2
            exit 1
          fi

      - name: Report status
        if: inputs.action == 'status'
        run: |
          set +e
          STATUS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/contents/${FLAG}" 2>&1)
          STATUS_EXIT=$?
          set -e

          if [ $STATUS_EXIT -eq 0 ]; then
            echo "Handoff notifications: ENABLED (.github/handoff-enabled exists)"
          elif echo "$STATUS" | grep -qi '"status":"404"\|Not Found'; then
            echo "Handoff notifications: DISABLED (.github/handoff-enabled not present)"
          else
            echo "ERROR: Failed to query flag file." >&2
            echo "$STATUS" >&2
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Notify on handoff document change
  # Runs only on push events. Checks for .github/handoff-enabled before notifying.
  # workflow_dispatch events never reach this job (event_name guard).
  # ─────────────────────────────────────────────────────────────────────────────
  notify-handoff:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Create handoff notification issue
        uses: actions/github-script@v7
        with:
          script: |
            // Check if notifications are enabled (flag file must exist).
            try {
              await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                path:  '.github/handoff-enabled',
              });
            } catch (e) {
              if (e.status === 404) {
                core.info('Notifications disabled (.github/handoff-enabled not found). Skipping.');
                return;
              }
              throw e;
            }

            const owner     = context.repo.owner;
            const repo      = context.repo.repo;
            const commit    = context.sha;
            const shortSha  = commit.slice(0, 8);
            const branch    = context.ref.replace('refs/heads/', '');
            const repoUrl   = `https://github.com/${owner}/${repo}`;
            const commitUrl = `${repoUrl}/commit/${commit}`;
            const payload   = context.payload;

            // File detection: use Compare Commits API for a reliable tree diff.
            // payload.commits[n].added/modified/removed is not used — GitHub push
            // payloads do not reliably populate these fields.
            // compareCommits(before, after) returns the complete tree difference
            // and is not affected by commit ancestry (e.g. merge-commit parents).
            //
            // Limit: GitHub Compare API returns at most 300 changed files per
            // response with no per-file pagination.  If the response reaches that
            // limit the file list may be incomplete; we fail explicitly rather than
            // create a notification with a potentially truncated file set.
            const handoffFiles = new Set();
            const isInitialPush = payload.before === '0'.repeat(40);

            if (!isInitialPush) {
              // Normal push: authoritative tree diff.
              // API failures are not caught — the step fails with a clear error.
              const { data: cmp } = await github.rest.repos.compareCommits({
                owner, repo,
                base: payload.before,
                head: payload.after,
              });
              const allFiles = cmp.files || [];
              if (allFiles.length >= 300) {
                throw new Error(
                  `Compare API returned ${allFiles.length} files (the maximum); ` +
                  'the file list may be truncated. Cannot determine complete handoff file set.'
                );
              }
              for (const f of allFiles) {
                if (f.filename.startsWith('_project_handoff/'))
                  handoffFiles.add(f.filename);
                if ((f.previous_filename || '').startsWith('_project_handoff/'))
                  handoffFiles.add(f.previous_filename);
              }
              core.info(`compareCommits(${payload.before.slice(0,8)}…${shortSha}): ${allFiles.length} total file(s), ${handoffFiles.size} handoff file(s).`);
            } else {
              // Initial push: payload.before is the null SHA; Compare API
              // requires a real commit SHA as base.
              //
              // Derive the base from the oldest pushed commit's parent via the
              // Git Commits API, then run compareCommits(base, after).
              // payload.commits[n].id (commit SHA) is used only as a pointer —
              // the file lists on those objects are not read.
              //
              // Fails explicitly when no parent exists (true root commit in a
              // new repository — no comparison base can be derived).
              if (!payload.commits || payload.commits.length === 0) {
                throw new Error(
                  'Initial push: payload.commits is empty; cannot derive a comparison base.'
                );
              }
              const oldestSha = payload.commits[0].id;
              const { data: oldestCommit } = await github.rest.git.getCommit({
                owner, repo, commit_sha: oldestSha,
              });
              if (!oldestCommit.parents || oldestCommit.parents.length === 0) {
                throw new Error(
                  `Initial push to new repository (${oldestSha.slice(0, 8)} has no parent); ` +
                  'no comparison base exists. Cannot create _project_handoff/ notification.'
                );
              }
              const baseSha = oldestCommit.parents[0].sha;
              const { data: cmp } = await github.rest.repos.compareCommits({
                owner, repo,
                base: baseSha,
                head: payload.after,
              });
              const allFiles = cmp.files || [];
              if (allFiles.length >= 300) {
                throw new Error(
                  `Compare API returned ${allFiles.length} files (the maximum); ` +
                  'the file list may be truncated. Cannot determine complete handoff file set.'
                );
              }
              for (const f of allFiles) {
                if (f.filename.startsWith('_project_handoff/'))
                  handoffFiles.add(f.filename);
                if ((f.previous_filename || '').startsWith('_project_handoff/'))
                  handoffFiles.add(f.previous_filename);
              }
              core.info(`Initial push compareCommits(${baseSha.slice(0, 8)}…${shortSha}): ${allFiles.length} total file(s), ${handoffFiles.size} handoff file(s).`);
            }

            const files = [...handoffFiles];
            if (files.length === 0) {
              core.info('No _project_handoff/ files in this push; skipping issue creation.');
              return;
            }

            const commitMessage = payload.head_commit
              ? payload.head_commit.message
              : '(commit message unavailable)';

            const fileList = files.map(f => `- \`${f}\``).join('\n');

            // Duplicate protection: search for an existing issue with this
            // commit SHA in its title.  GitHub Search has an indexing delay of
            // roughly 60 s; a workflow rerun within that window may still create
            // a duplicate — this is a known platform limitation.
            const { data: searchResults } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue "${shortSha}" in:title`,
            });
            if (searchResults.total_count > 0) {
              core.info(`Notification issue for commit ${shortSha} already exists (#${searchResults.items[0].number}). Skipping duplicate.`);
              return;
            }

            // Note: GitHub Issue creation does not guarantee an email
            // notification.  Email delivery depends on the assignee's GitHub
            // notification settings.
            const body = [
              `## Handoff Document Update`,
              ``,
              `**Branch:** \`${branch}\``,
              `**Commit:** [\`${shortSha}\`](${commitUrl})`,
              ``,
              `### Changed handoff files`,
              fileList,
              ``,
              `### Commit message`,
              `\`\`\``,
              commitMessage,
              `\`\`\``,
              ``,
              `---`,
              `*This issue was created automatically by the handoff-notifications workflow.*`,
              `*To disable notifications, run the workflow with action: stop.*`,
            ].join('\n');

            await github.rest.issues.create({
              owner, repo,
              title: `[Handoff Update] ${shortSha} on ${branch}`,
              body,
              assignees: [owner],
            });
